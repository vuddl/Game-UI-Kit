<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game UI Kit form</title>
<style>
:root{
  --bg:#f1f0f6;--card:#ffffff;--text:#1d1c22;--muted:#6b6878;--line:#dcdae4;--accent:#5b4bd6;--accent-soft:#ece9fd;
  --danger:#c62f3a;--ok:#1d8a4e;--field:#fafafc;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#15141a;--card:#1f1e26;--text:#ecebf2;--muted:#9e9bab;--line:#34323e;--accent:#9b8cff;--accent-soft:#2b2840;
    --danger:#ff6b75;--ok:#4cc985;--field:#18171e}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:14px}
.head{border-top:8px solid var(--accent)}
h1{margin:0 0 6px;font-size:26px}
.intro,.hint{color:var(--muted);margin:0}
.hint{font-size:13px;margin-top:2px}
.q.invalid{border-color:var(--danger)}
.qt{font-weight:600;font-size:16px}
.req{color:var(--danger);margin-left:3px}
.err{color:var(--danger);font-size:13px;margin-top:8px;display:none}
.q.invalid .err{display:block}
.opts{margin-top:12px;display:flex;flex-direction:column;gap:2px}
.group{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:10px 0 2px}
.opt{border-radius:8px;padding:6px 8px}
.opt:hover{background:var(--accent-soft)}
.opt>label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.opt input[type=radio],.opt input[type=checkbox]{margin-top:4px;accent-color:var(--accent);width:17px;height:17px;flex:none}
.opt .oh{color:var(--muted);font-size:13px}
.opt img.thumb{display:block;max-width:220px;max-height:140px;border-radius:6px;border:1px solid var(--line);margin-top:6px}
.extra{margin:8px 0 6px 27px;display:flex;flex-direction:column;gap:8px}
input[type=text],input[type=number],input[type=url],textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--text);font:inherit}
textarea{min-height:64px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.suggestions{max-height:230px;overflow:auto;margin-top:4px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.suggestion{display:block;width:100%;padding:8px 11px;border:0;background:transparent;color:var(--text);text-align:left}
.suggestion:hover,.suggestion[aria-selected=true]{background:var(--accent-soft)}
.suggestion small{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;color:var(--muted);white-space:normal}
.flabel{font-size:13px;color:var(--muted);margin-bottom:3px}
.fields{display:grid;gap:10px;margin-top:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drop{width:100%;background:transparent;border:1.5px dashed var(--line);border-radius:10px;padding:12px;text-align:center;color:var(--muted);cursor:pointer;font-size:14px}
.drop strong{display:block;color:var(--accent);margin-bottom:2px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.drop.compact{width:auto;align-self:flex-start;padding:4px 9px;font-size:13px}
.drop.compact strong{margin:0}
.files{display:flex;flex-direction:column;gap:8px}
.files:empty{display:none}
.file{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px}
.file img,.file .ph{width:56px;height:56px;object-fit:contain;border-radius:6px;background:var(--field);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.file .nm{font-size:13px;word-break:break-all}
.file input,.file textarea{margin-top:4px;padding:6px 9px;font-size:13px}
.file .ff{display:flex;flex-direction:column;gap:4px;min-width:0}
.file .ff .flabel{margin:4px 0 0}
.file.big{grid-template-columns:120px 1fr auto;align-items:start}
.file.big img,.file.big .ph{width:120px;height:120px}
.file.link-source{grid-template-columns:minmax(0,1fr) auto;align-items:start;padding:8px 10px}
.link-source .ff{gap:8px}
.description-box{min-width:0;gap:6px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--field)}
.description-box:focus-within{border-color:var(--accent)}
.description-box textarea{display:block;margin:0;padding:0 4px;min-height:44px;border:0;background:transparent;outline:none}
.description-attachments{display:flex;flex-wrap:wrap;gap:8px}
.description-attachments:empty{display:none}
.description-attachment{position:relative}
.description-box .description-attachment :is(img,.ph){display:grid;place-items:center;width:64px;height:64px;object-fit:contain;border-radius:6px;background:var(--card);color:var(--muted);font-size:11px}
.description-attachment .x{position:absolute;top:3px;right:3px;width:22px;height:22px;padding:0;border-radius:50%;background:#25232e;color:#fff;font-size:15px;line-height:1}
.description-box .attachment-add{width:30px;height:30px;padding:0;font-size:20px;line-height:1}
.image-thumb{display:block;padding:0;border:0;background:transparent;cursor:zoom-in}
.image-thumb:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.image-viewer{position:fixed;inset:0;width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;padding:16px;border:0;background:rgba(12,12,16,.92);color:#fff;overflow:hidden}
.image-viewer[open]{display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px}
.image-viewer.with-details[open]{grid-template-rows:auto minmax(0,1fr) auto}
.image-viewer.file-details[open]{grid-template-rows:auto auto;align-content:start}
.image-viewer::backdrop{background:rgba(0,0,0,.7)}
.viewer-toolbar{display:flex;align-items:center;gap:16px;justify-content:space-between}
.viewer-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer-close{flex:none;border:1px solid #777;background:#28282e;color:#fff;padding:6px 14px}
.viewer-stage{min-height:0;display:flex;align-items:center;justify-content:center}
.viewer-stage img{max-width:100%;max-height:100%;object-fit:contain}
.viewer-details{width:min(100%,680px);max-height:35dvh;overflow:auto;justify-self:center}
.viewer-details textarea{color:var(--text)}
button{font:inherit;cursor:pointer;border-radius:8px}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;padding:4px 8px}
.x:hover{color:var(--danger)}
.add{border:1px solid var(--line);background:transparent;color:var(--accent);padding:6px 12px;align-self:flex-start}
.custom{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.custom .top{display:flex;gap:8px;align-items:center}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.send{background:var(--accent);color:#fff;border:0;padding:10px 26px;font-weight:600}
.send:disabled{opacity:.6;cursor:default}
.status{color:var(--muted);font-size:14px}
.done{text-align:center;padding:48px 20px}
.done h2{margin:0 0 6px;color:var(--ok)}
.hidden{display:none!important}
@media (max-width:520px){.row2{grid-template-columns:1fr}.opt img.thumb{max-width:100%}}
</style>
</head>
<body>
<main id="app"><div class="card status">Đang tải…</div></main>
<script>
"use strict";
const IMG = /\.(png|jpe?g|webp|gif)$/i;
let SPEC, CTX, VALUES = {}, UPLOADS = 0, PREFLIGHTS = 0;
const photoshopChecks = new Map();
const app = document.getElementById("app");

function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})){
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "text") e.textContent = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) e.append(kid);
  return e;
}
const fileUrl = p => "/kitfile?p=" + encodeURIComponent(p);

function attachmentThumbnail(path, name, details){
  const image = IMG.test(path);
  const action = image ? "Xem ảnh lớn" : "Xem tệp đính kèm";
  const preview = image ? el("img", {src: fileUrl(path), alt: name})
    : el("span", {class: "ph", text: path.match(/\.([a-z0-9]{1,5})$/i)?.[1].toUpperCase() || "TỆP"});
  return el("button", {class: "image-thumb", type: "button", title: name,
    "aria-label": action + ": " + name, onclick: e => {
      const opener = e.currentTarget;
      const previousOverflow = document.body.style.overflow;
      const viewer = el("dialog", {class: "image-viewer", "aria-label": action + ": " + name});
      if (details) viewer.classList.add(image ? "with-details" : "file-details");
      let cleaned = false;
      function cleanup(){
        if (cleaned) return;
        cleaned = true;
        document.body.style.overflow = previousOverflow;
        viewer.remove();
        if (opener.isConnected) opener.focus({preventScroll: true});
      }
      function dismiss(){ viewer.close(); cleanup(); }
      const close = el("button", {class: "viewer-close", type: "button", "aria-label": image ? "Đóng ảnh lớn" : "Đóng tệp",
        onclick: dismiss}, "Đóng ×");
      viewer.append(el("div", {class: "viewer-toolbar"}, el("span", {class: "viewer-name", text: name}), close));
      if (image) {
        const stage = el("div", {class: "viewer-stage", onclick: event => {
          if (event.target === stage) dismiss();
        }}, el("img", {src: fileUrl(path), alt: name}));
        viewer.append(stage);
      }
      if (details) viewer.append(el("div", {class: "viewer-details"}, details()));
      viewer.addEventListener("click", event => { if (event.target === viewer) dismiss(); });
      viewer.addEventListener("cancel", event => { event.preventDefault(); dismiss(); });
      viewer.addEventListener("close", cleanup, {once: true});
      document.body.append(viewer);
      document.body.style.overflow = "hidden";
      viewer.showModal();
    }}, preview);
}

function textInput(value, onChange, opts = {}){
  const tag = opts.multiline ? "textarea" : "input";
  const input = el(tag, {type: opts.multiline ? undefined : (opts.number ? "number" : opts.type || "text"),
    placeholder: opts.placeholder || "", min: opts.min, max: opts.max});
  input.value = value ?? "";
  input.addEventListener("input", () => onChange(opts.number ? (input.value === "" ? null : Number(input.value)) : input.value));
  return input;
}

const searchText = s => s.toLowerCase().normalize("NFD").replace(/\p{M}/gu, "").replace(/đ/g, "d");
let suggestionLists = 0;

function descriptionChoices(source, context, area){
  const catalog = SPEC.description_suggestions?.[source] || [];
  const key = context ? slug(context) : "";
  const personal = SPEC.personal_suggestions?.[source]?.[key]?.[area || ""] || [];
  const selected = key && catalog.find(item => slug(item.label) === key);
  if (source === "screen_overviews") return selected ? [selected] : [];
  if (source !== "screens"){
    const ordered = selected ? [selected, ...catalog.filter(item => item !== selected)] : catalog;
    return [...personal, ...ordered];
  }

  const areas = area === "middle" ? ["middle", "left", "right"] : [area];
  const screenChoices = (selected ? [selected] : catalog).flatMap(screen => {
    const regions = area ? screen.regions.filter(region => region.areas.some(a => areas.includes(a))) : screen.regions;
    const choices = regions.map(region => ({label: `${screen.label} · ${region.label}`, text: region.text,
      hint: `${region.position} · ${region.text}`}));
    if (selected && choices.length > 1){
      choices.unshift({label: `${screen.label} · ${area ? "Toàn bộ vùng này" : "Tất cả vùng"}`,
        hint: regions.map(region => region.label).join(" · "),
        text: regions.map(region => `${region.label}: ${region.text}`).join("\n")});
    }
    return choices;
  });
  return [...personal, ...screenChoices];
}

function descriptionInput(value, onChange, opts, getContext = () => ""){
  const input = textInput(value, onChange, opts);
  if (!SPEC.description_suggestions?.[opts.suggest_from]?.length && !SPEC.personal_suggestions?.[opts.suggest_from]) return input;
  const list = el("div", {id: `suggestions_${++suggestionLists}`, class: "suggestions", role: "listbox",
    "aria-label": "Gợi ý mô tả", hidden: true});
  input.setAttribute("aria-controls", list.id);
  input.setAttribute("aria-autocomplete", "list");
  input.setAttribute("aria-expanded", "false");
  let active = -1;

  function setOpen(open){
    list.hidden = !open;
    input.setAttribute("aria-expanded", String(open));
    input.removeAttribute("aria-activedescendant");
    active = -1;
  }
  function show(query){
    const choice = VALUES[opts.suggest_context]?.value;
    const context = choice ? (choice.choice === "other" ? choice.label : choice.choice) : getContext();
    const terms = searchText(query).trim().split(/\s+/).filter(Boolean);
    const matches = descriptionChoices(opts.suggest_from, context, opts.area).filter(item => {
      const content = searchText(`${item.label} ${item.text} ${item.hint || ""}`);
      return terms.every(term => content.includes(term));
    });
    list.replaceChildren(...matches.map((item, index) => el("button", {
      id: `${list.id}_${index}`, class: "suggestion", type: "button", role: "option", tabindex: "-1",
      "aria-selected": "false", onpointerdown: e => e.preventDefault(), onclick: () => {
        input.value = item.text;
        onChange(item.text);
        setOpen(false);
      }
    }, el("strong", {text: item.label}), el("small", {text: item.hint || item.text}))));
    setOpen(matches.length > 0);
  }

  input.addEventListener("focus", () => show(""));
  input.addEventListener("input", () => show(input.value));
  input.addEventListener("blur", () => setOpen(false));
  input.addEventListener("keydown", e => {
    if (e.isComposing) return;
    if (e.key === "Escape" && !list.hidden){
      e.preventDefault();
      setOpen(false);
    } else if (e.key === "Enter" && !list.hidden && active >= 0){
      e.preventDefault();
      list.children[active].click();
    } else if (e.key === "ArrowDown" || e.key === "ArrowUp"){
      if (list.hidden && e.altKey && e.key === "ArrowDown") show("");
      if (list.hidden) return;
      e.preventDefault();
      if (active >= 0) list.children[active].setAttribute("aria-selected", "false");
      const count = list.children.length;
      active = e.key === "ArrowDown" ? (active + 1) % count : (active > 0 ? active - 1 : count - 1);
      const option = list.children[active];
      option.setAttribute("aria-selected", "true");
      input.setAttribute("aria-activedescendant", option.id);
      option.scrollIntoView({block: "nearest"});
    }
  });
  return el("div", {}, input, list);
}

/* Fields under each uploaded file. */
const NOTE_FIELD = [{id: "note", label: "Ghi chú tệp (không bắt buộc)", multiline: true}];
const isLink = source => Object.hasOwn(source, "url");

function validSourceLink(value){
  const link = value.trim();
  if (!/^https?:\/\/[^/\\?#\s]+/i.test(link) || /[\s\\]/.test(link)) return false;
  try {
    const url = new URL(link);
    return Boolean(url.hostname && !url.username && !url.password);
  } catch {
    return false;
  }
}

let LISTS = 0;
function fileFieldInputs(f, defs){
  return defs.map(d => {
    const change = v => { f[d.id] = v; };
    const input = d.suggest_from ? descriptionInput(f[d.id], change, d, () => f.screen) : textInput(f[d.id], change, d);
    if (d.label) (input.matches("input, textarea") ? input : input.querySelector("input, textarea")).setAttribute("aria-label", d.label);
    const wrap = el("div", {}, d.label ? el("div", {class: "flabel", text: d.label}) : null);
    if (d.suggestions && d.suggestions.length){
      const id = "list_" + (++LISTS);
      input.setAttribute("list", id);
      wrap.append(el("datalist", {id}, d.suggestions.map(s => el("option", {value: s}))));
    }
    const attachment = fieldAttachment(f, d.id, "file_fields", input, d.label, {description: d.multiline});
    if (!d.multiline) wrap.append(input);
    wrap.append(attachment);
    return wrap;
  });
}

function linkFields(link, where){
  const url = textInput(link.url, value => { link.url = value; },
    {type: "url", placeholder: "https://www.figma.com/design/…"});
  url.setAttribute("aria-label", "Liên kết wireframe");
  const description = textInput(link.note, value => { link.note = value; },
    {multiline: true, placeholder: "Frame cần xem hoặc chi tiết cần chú ý"});
  description.setAttribute("aria-label", "Mô tả liên kết (không bắt buộc)");
  return el("div", {class: "ff"},
    el("div", {}, el("div", {class: "flabel", text: "Liên kết wireframe"}), url),
    el("div", {}, el("div", {class: "flabel", text: "Mô tả liên kết (không bắt buộc)"}),
      fieldAttachment(link, "note", where + "/links", description, "mô tả liên kết", {description: true, imagesOnly: true})));
}

function pasteFiles(target, send){
  target.addEventListener("paste", e => {
    if (e.defaultPrevented || !e.clipboardData) return;
    const files = [...(e.clipboardData.files || [])];
    if (!files.length) files.push(...[...(e.clipboardData.items || [])].filter(item => item.kind === "file")
      .map(item => item.getAsFile()).filter(Boolean));
    if (!files.length) return;
    e.preventDefault();
    send(files.map(file => {
      if (!file.type.startsWith("image/") || /\.[a-z0-9]+$/i.test(file.name)) return file;
      const extension = file.type.split("/")[1].replace("jpeg", "jpg").split("+")[0];
      return new File([file], `clipboard.${extension}`, {type: file.type});
    }));
  });
}

/* Files: a list of {path, name, note, ...}. Artwork inputs also unpack supported assets from ZIP. */
function filesWidget(list, where, {hint, fieldDefs, label, target, assets, unpack, allowLinks,
  compact = false, description = false, imagesOnly = false} = {}){
  const defs = fieldDefs || NOTE_FIELD;
  const box = el("div", {class: description ? "files description-box" : "files"});
  const listBox = el("div", {class: description ? "description-attachments" : "files"});
  const linksBox = allowLinks ? el("div", {class: "files"}) : null;
  const picker = el("input", {type: "file", multiple: true, class: "hidden",
    accept: imagesOnly ? ".png,.jpg,.jpeg,.webp,.gif" : (assets ? ".png,.jpg,.jpeg,.webp,.psd,.zip" : undefined)});
  const action = imagesOnly ? "Thêm ảnh" : "Thêm ảnh hoặc tệp";
  const addLabel = description && !imagesOnly && label?.startsWith("Thêm ") ? label
    : label ? `${action} cho ${label}` : action;
  const drop = description
    ? el("button", {class: "drop compact attachment-add", type: "button", "aria-label": addLabel,
      title: addLabel}, "+")
    : el("button", {class: compact ? "drop compact" : "drop", type: "button",
    title: compact ? "Bấm để chọn, kéo thả hoặc dán từ clipboard" : undefined,
    "aria-label": addLabel},
    el("strong", {text: compact ? "+ " + action : (label || action)}),
    compact ? null : el("div", {}, hint || "Kéo thả tệp vào đây hoặc bấm để chọn.",
      el("div", {class: "hint", text: "Bạn cũng có thể dán bằng Ctrl+V."})));
  function draw(){
    const files = [];
    const links = [];
    list.forEach((f, i) => {
      const link = allowLinks && isLink(f);
      const removeLabel = link ? "Bỏ liên kết" : (description && IMG.test(f.path) ? "Bỏ ảnh" : "Bỏ file");
      const remove = el("button", {class: "x", type: "button", title: removeLabel, "aria-label": removeLabel,
        onclick: () => { list.splice(i, 1); draw(); refresh(); }}, "×");
      if (link){
        links.push(el("div", {class: "file link-source"}, linkFields(f, where), remove));
        return;
      }
      const name = f.name || f.path.split("/").pop();
      const ext = f.path.match(/\.([a-z0-9]{1,5})$/i)?.[1];
      if (description){
        const details = imagesOnly ? undefined : () => fileFieldInputs(f, defs);
        files.push(el("div", {class: "description-attachment"}, attachmentThumbnail(f.path, name, details), remove));
        return;
      }
      const preview = IMG.test(f.path) ? attachmentThumbnail(f.path, name)
        : el("div", {class: "ph", title: name}, ext?.toUpperCase() || "TỆP");
      files.push(el("div", {class: fieldDefs ? "file big" : "file"}, preview,
        el("div", {class: "ff"}, el("div", {class: "nm", text: name}), fileFieldInputs(f, defs)), remove));
    });
    listBox.replaceChildren(...files);
    if (linksBox) linksBox.replaceChildren(...links);
  }
  async function send(files){
    if (imagesOnly){
      const images = files.filter(file => IMG.test(file.name));
      if (images.length !== files.length) alert("Mô tả liên kết nhận ảnh PNG, JPG, WebP hoặc GIF.");
      files = images;
    }
    if (!files.length) return;
    UPLOADS++; refresh();
    try {
      for (const file of files){
        status("Đang tải " + file.name + "…");
        try {
          const query = new URLSearchParams({where, name: file.name});
          if (!assets) query.set("kind", "reference");
          if (unpack) query.set("unpack", "1");
          const r = await fetch("/upload?" + query, {method: "POST", body: file});
          const data = await r.json();
          if (!r.ok) throw new Error(data.error || r.statusText);
          for (const f of data.files) if (!list.some(x => x.path === f.path)) list.push({path: f.path, name: f.name, note: ""});
        } catch (e){ alert("Không tải được " + file.name + ": " + e.message); }
      }
      if (box.isConnected) draw(); else rerender();
    } finally {
      UPLOADS--;
      if (!UPLOADS) status("");
      refresh();
    }
  }
  pasteFiles(box, send);
  if (target && !description) pasteFiles(target, send);
  picker.addEventListener("change", () => { send([...picker.files]); picker.value = ""; });
  drop.addEventListener("click", () => picker.click());
  function allowDrop(node){
    node.addEventListener("dragover", e => {
      if (e.defaultPrevented || !e.dataTransfer.types.includes("Files")) return;
      e.preventDefault(); drop.classList.add("over");
    });
    node.addEventListener("dragleave", () => drop.classList.remove("over"));
    node.addEventListener("drop", e => {
      if (e.defaultPrevented || !e.dataTransfer.files.length) return;
      e.preventDefault(); drop.classList.remove("over"); send([...e.dataTransfer.files]);
    });
  }
  allowDrop(box);
  if (target && !description) allowDrop(target);
  draw();
  box.append(listBox);
  if (description) box.append(target);
  box.append(drop, picker);
  if (!linksBox) return box;
  const addLink = el("button", {class: "add", type: "button", onclick: () => {
    list.push({url: "", note: ""});
    draw();
    linksBox.lastElementChild.querySelector('input[type="url"]').focus();
  }}, "+ Thêm liên kết");
  return el("div", {class: "files"}, box, addLink, linksBox);
}

function fieldAttachment(owner, id, where, target, label, {description, imagesOnly, unpack} = {}){
  owner.field_files ||= {};
  const list = owner.field_files[id] ||= [];
  return filesWidget(list, `${where}/${id}`, {target, label, compact: true, description, imagesOnly, unpack});
}

function fieldsWidget(defs, store, opts, owner){
  return el("div", {class: defs.length === 2 && defs.every(d => d.type === "number") ? "row2" : "fields"},
    defs.map(d => {
      const input = descriptionInput(store[d.id], v => { store[d.id] = v; }, {...d, number: d.type === "number",
        suggest_from: opts.suggest_from, suggest_context: opts.suggest_context, area: d.id});
      const attachment = fieldAttachment(owner, d.id, opts.id, input, d.label,
        {description: d.multiline, unpack: opts.attach_fields});
      return el("div", {}, el("div", {class: "flabel", text: d.label + (d.required ? " *" : "")}),
        d.multiline ? attachment : [input, attachment]);
    }));
}

/* Extras under a chosen option: fields, a description and files. */
function optionExtras(q, opt, entry, nameInput){
  const x = Object.assign({}, q.option_extras || {}, opt);
  const box = el("div", {class: "extra"});
  const where = `${q.id}/${entry.choice === "other" ? slug(entry.label || "other") : entry.choice}`;
  if (nameInput) box.append(fieldAttachment(entry, "label", where, nameInput, nameInput.placeholder));
  if (x.fields){
    entry.fields ||= {};
    box.append(fieldsWidget(x.fields, entry.fields, {id: where}, entry));
  }
  entry.files ||= [];
  if (x.describe){
    const note = descriptionInput(entry.note, v => { entry.note = v; }, {...x, multiline: true,
      placeholder: x.describe_placeholder || "Mô tả"}, () => entry.choice === "other" ? entry.label : entry.choice);
    box.append(x.attach_assets
      ? fieldAttachment(entry, "note", where, note, "mô tả", {description: true})
      : filesWidget(entry.files, where, {target: note, description: true, unpack: x.attach, label: x.attach_label}));
  }
  if (x.attach && (x.attach_assets || !x.describe)){
    box.append(filesWidget(entry.files, where, {hint: x.attach_hint, label: x.attach_label,
      assets: x.attach_assets, unpack: !x.attach_assets}));
  }
  return box.childElementCount ? box : null;
}
const slug = s => (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "") || "other";

function visible(cond){
  if (!cond) return true;
  if (cond.context) return (cond.in || []).includes(CTX[cond.context]);
  const q = SPEC.questions.find(x => x.id === cond.question);
  if (!q || !isShown(q)) return false;
  const v = (VALUES[q.id] || {}).value;
  if (v === undefined || v === null) return false;
  const picked = Array.isArray(v) ? v.map(e => e.choice) : (typeof v === "object" ? [v.choice] : [v]);
  return picked.some(p => (cond.in || []).includes(p));
}
const isShown = q => visible(q.show_if);
/* required_if: the question is required only while that condition holds. */
const isRequired = q => !!q.required || (!!q.required_if && visible(q.required_if));

const photoshopPath = choice => choice?.choice === "other" ? (choice.label || "").trim().replace(/^"|"$/g, "") : (choice?.choice || "");

function photoshopConfigWidget(state){
  const slot = el("div", {class: "fields"});
  async function check(force = false){
    const path = photoshopPath(state.value);
    if (!path){ slot.replaceChildren(el("p", {class: "hint", text: "Chọn bản Photoshop để kiểm tra và cấu hình tự động."})); return; }
    let entry = photoshopChecks.get(path);
    if (!entry || (force && entry.result)){
      entry = {};
      photoshopChecks.set(path, entry);
      PREFLIGHTS++; refresh();
      entry.pending = (async () => {
        try {
          const response = await fetch("/photoshop-config", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({path})});
          entry.result = await response.json();
          if (!response.ok) entry.result.ok = false;
        } catch (error){ entry.result = {ok: false, error: error.message}; }
        finally { PREFLIGHTS--; refresh(); }
      })();
    }
    slot.replaceChildren(el("p", {class: "hint", role: "status", text: "Đang kiểm tra cấu hình Photoshop…"}));
    await entry.pending;
    if (photoshopPath(state.value) !== path) return;
    const result = entry.result;
    slot.replaceChildren(el("p", {class: "hint", role: "status", text: result.ok
      ? "Photoshop đã sẵn sàng chạy script xuất PSD, không hỏi xác nhận từng lần."
      : (result.error || "Không kiểm tra được cấu hình Photoshop.")}),
      el("button", {class: "add", type: "button", onclick: () => check(true)}, "Kiểm tra lại"));
  }
  slot.check = check;
  check();
  return slot;
}

function renderQuestion(q){
  const card = el("section", {class: "card q", id: "q_" + q.id, hidden: q.hidden});
  const state = VALUES[q.id] = VALUES[q.id] || {};
  card.append(el("div", {class: "qt"}, q.title, isRequired(q) ? el("span", {class: "req", text: "*"}) : null));
  if (q.hint) card.append(el("p", {class: "hint", text: q.hint}));
  const body = el("div", {});
  card.append(body);

  if (q.type === "single" || q.type === "multi"){
    const multi = q.type === "multi";
    if (multi && !Array.isArray(state.value)) state.value = [];
    const opts = el("div", {class: "opts"});
    let group = null;
    const find = v => multi ? state.value.find(e => e.choice === v) : (state.value && state.value.choice === v ? state.value : null);
    for (const opt of q.options){
      if (opt.show_if && !visible(opt.show_if)){
        if (find(opt.value)){ if (multi) state.value = state.value.filter(e => e.choice !== opt.value); else state.value = null; }
        continue;
      }
      if (opt.group && opt.group !== group){ group = opt.group; opts.append(el("div", {class: "group", text: group})); }
      const chosen = find(opt.value);
      const input = el("input", {type: multi ? "checkbox" : "radio", name: q.id, checked: !!chosen});
      input.addEventListener("change", () => {
        if (multi){
          if (input.checked) state.value.push({choice: opt.value, label: opt.label});
          else state.value = state.value.filter(e => e.choice !== opt.value);
        } else state.value = {choice: opt.value, label: opt.label};
        rerender();
      });
      const row = el("div", {class: "opt"}, el("label", {}, input, el("div", {},
        el("div", {text: opt.label}), opt.hint ? el("div", {class: "oh", text: opt.hint}) : null,
        opt.image ? el("img", {class: "thumb", src: fileUrl(opt.image), alt: opt.label}) : null)));
      if (chosen){ const extra = optionExtras(q, opt, chosen); if (extra) row.append(extra); }
      opts.append(row);
    }
    if (q.other){
      const o = q.other;
      if (multi){
        const customs = state.value.filter(e => e.choice === "other");
        opts.append(el("div", {class: "group", text: o.label}));
        customs.forEach(entry => {
          const name = textInput(entry.label, v => { entry.label = v; }, {placeholder: o.placeholder});
          const box = el("div", {class: "custom"}, el("div", {class: "top"}, name,
            el("button", {class: "x", type: "button", title: "Bỏ", "aria-label": "Bỏ", onclick: () => {
              state.value = state.value.filter(e => e !== entry); rerender(); }}, "×")));
          const extra = optionExtras(q, o, entry, name);
          extra.style.marginLeft = "0";
          box.append(extra);
          opts.append(box);
        });
        opts.append(el("button", {class: "add", type: "button", onclick: () => {
          state.value.push({choice: "other", label: ""}); rerender(); }}, "+ Thêm " + o.label.toLowerCase()));
      } else {
        const chosen = state.value && state.value.choice === "other" ? state.value : null;
        const input = el("input", {type: "radio", name: q.id, checked: !!chosen});
        input.addEventListener("change", () => { state.value = {choice: "other", label: ""}; rerender(); });
        const row = el("div", {class: "opt"}, el("label", {}, input, el("div", {text: o.label})));
        if (chosen){
          const name = textInput(chosen.label, v => { chosen.label = v; }, {placeholder: o.placeholder});
          const extra = optionExtras(q, o, chosen, name);
          extra.prepend(name);
          row.append(extra);
        }
        opts.append(row);
      }
    }
    body.append(opts);
  } else if (q.type === "text"){
    if (state.value === undefined) state.value = "";
    const input = descriptionInput(state.value, v => { state.value = v; },
      {...q, multiline: true, placeholder: q.placeholder || "Câu trả lời"});
    body.append(questionField(q, state, input));
  } else if (q.type === "number"){
    if (state.value === undefined || state.value === null) state.value = q.default ?? null;
    const input = textInput(state.value, v => { state.value = v; }, {number: true, min: q.min, max: q.max});
    body.append(questionField(q, state, input));
  } else if (q.type === "fields"){
    state.value = state.value || {};
    const defs = q.fields_by ? (q.fields_by[CTX[q.fields_by.context]] || []) : q.fields;
    body.append(fieldsWidget(defs, state.value, q, state));
  } else if (q.type === "files"){
    if (!Array.isArray(state.value)) state.value = [];
    body.append(el("div", {class: "fields"}, filesWidget(state.value, q.id,
      {hint: q.attach_hint, fieldDefs: q.file_fields, assets: true, allowLinks: q.allow_links})));
  }
  if (q.describe){
    const input = textInput(state.note, v => { state.note = v; }, {multiline: true});
    body.append(el("div", {class: "fields"}, el("div", {class: "flabel", text: q.describe_label || "Mô tả thêm"}),
      fieldAttachment(state, "note", q.id, input, q.describe_label || "mô tả thêm", {description: true})));
  }
  if (SPEC.id === "export" && q.id === "photoshop"){
    const config = photoshopConfigWidget(state);
    body.append(config);
    card.addEventListener("focusout", e => { if (e.target.matches('input[type="text"]')) config.check(); });
  }
  card.append(el("div", {class: "err", text: SPEC.id === "export" && q.id === "photoshop"
    ? "Chọn bản Photoshop và hoàn tất kiểm tra cấu hình bên trên." : (q.allow_links
      ? "Thêm tệp hoặc liên kết wireframe hợp lệ bắt đầu bằng https:// hoặc http://."
      : "Câu này cần trả lời.")}));
  return card;
}

function questionField(q, state, input){
  state.files ||= [];
  const description = q.type === "text";
  const attachment = filesWidget(state.files, q.id + "/_question",
    {target: input, label: q.attach_label || q.title, unpack: q.attach, compact: true, description});
  return el("div", {class: "fields"}, description ? attachment : [input, attachment]);
}

let sendBtn, statusBox;
function status(text){ if (statusBox) statusBox.textContent = text; }
function refresh(){ if (sendBtn) sendBtn.disabled = UPLOADS > 0 || PREFLIGHTS > 0; }

function rerender(){
  const y = window.scrollY;
  const box = document.getElementById("questions");
  box.replaceChildren(...SPEC.questions.filter(isShown).map(renderQuestion));
  window.scrollTo(0, y);
}

function problem(q){
  const s = VALUES[q.id] || {};
  const v = s.value;
  if (SPEC.id === "export" && q.id === "photoshop" && !photoshopChecks.get(photoshopPath(v))?.result?.ok) return true;
  q = Object.assign({}, q, {required: isRequired(q)});
  const blank = x => x === undefined || x === null || (typeof x === "string" && !x.trim());
  if (q.type === "single" || q.type === "multi"){
    const entries = q.type === "multi" ? (v || []) : (v ? [v] : []);
    if (q.required && !entries.length) return true;
    for (const e of entries){
      if (e.choice === "other" && blank(e.label)) return true;
      const option = e.choice === "other" ? q.other : q.options.find(o => o.value === e.choice);
      const opt = Object.assign({}, q.option_extras || {}, option);
      if (opt.attach_required && !(e.files || []).length) return true;
      if (opt.describe_required && blank(e.note)) return true;
      for (const f of (opt.fields || [])) if (f.required && blank((e.fields || {})[f.id])) return true;
    }
    return false;
  }
  if (q.type === "files"){
    const sources = v || [];
    return (q.required && !sources.length)
      || (q.allow_links && sources.some(source => isLink(source) && !validSourceLink(source.url)));
  }
  if (q.type === "number") return (q.required && blank(v)) || (!blank(v) && ((q.min !== undefined && v < q.min) || (q.max !== undefined && v > q.max)));
  if (q.type === "fields") return false;
  return q.required && blank(v) && !(q.attach && (s.files || []).length);
}

async function submit(){
  if (UPLOADS > 0 || PREFLIGHTS > 0) return;
  const shown = SPEC.questions.filter(isShown);
  let first = null;
  for (const q of shown){
    const bad = problem(q);
    document.getElementById("q_" + q.id).classList.toggle("invalid", bad);
    if (bad && !first) first = q;
  }
  if (first){ document.getElementById("q_" + first.id).scrollIntoView({behavior: "smooth", block: "center"}); status("Còn câu chưa trả lời."); return; }
  const answers = {};
  for (const q of shown){
    const s = VALUES[q.id] || {};
    const a = {value: s.value};
    if (q.type === "multi") a.value = (s.value || []).filter(e => e.choice !== "other" || (e.label || "").trim());
    if (q.describe && s.note) a.note = s.note;
    if (s.files?.length) a.files = s.files;
    if (s.field_files) a.field_files = s.field_files;
    answers[q.id] = a;
  }
  sendBtn.disabled = true; status("Đang gửi…");
  try {
    const payload = JSON.stringify({answers}, (key, value) => {
      if (key === "files" && Array.isArray(value) && !value.length) return undefined;
      if (key !== "field_files" || !value) return value;
      const fields = Object.entries(value).filter(([, files]) => files.length);
      return fields.length ? Object.fromEntries(fields) : undefined;
    });
    const r = await fetch("/submit", {method: "POST", headers: {"Content-Type": "application/json"}, body: payload});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.statusText);
    const timer = el("p", {class: "hint", role: "timer", text: "Tab sẽ tự đóng sau 5 giây."});
    app.replaceChildren(el("div", {class: "card done"}, el("h2", {text: "Đã gửi"}),
      el("p", {class: "intro", text: "Codex sẽ tự làm tiếp."}), timer,
      el("p", {class: "hint", text: "Nếu sau một lúc Codex vẫn đứng im, gõ “xong” trong Codex."})));
    let seconds = 5;
    const countdown = setInterval(() => {
      seconds -= 1;
      timer.textContent = `Tab sẽ tự đóng sau ${seconds} giây.`;
    }, 1000);
    setTimeout(() => {
      clearInterval(countdown);
      timer.textContent = "Bạn có thể đóng tab này.";
      window.close();
    }, 5000);
  } catch (e){ sendBtn.disabled = false; status("Không gửi được: " + e.message); }
}

(async function start(){
  try {
    const r = await fetch("/spec");
    const data = await r.json();
    SPEC = data.form; CTX = data.context || {};
    for (const [k, v] of Object.entries(data.prefill || {})) VALUES[k] = JSON.parse(JSON.stringify(v));
    for (const q of SPEC.questions) if (q.fixed_value) VALUES[q.id] = {value: {...q.fixed_value}};
  } catch (e){ app.replaceChildren(el("div", {class: "card", text: "Không tải được form: " + e.message})); return; }
  document.title = SPEC.title;
  sendBtn = el("button", {class: "send", type: "button", onclick: submit}, "Hoàn thành");
  statusBox = el("span", {class: "status"});
  app.replaceChildren(
    el("div", {class: "card head"}, el("h1", {text: SPEC.title}), SPEC.intro ? el("p", {class: "intro", text: SPEC.intro}) : null,
      CTX.summary ? el("p", {class: "hint", text: CTX.summary}) : null),
    el("div", {id: "questions"}),
    el("div", {class: "bar"}, sendBtn, statusBox));
  rerender();
})();
</script>
